name: build
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (только наши файлы)
        run: rustfmt --edition 2024 src/media_controls_linux.rs src/main.rs && git diff --stat
      - run: cargo build --release
      - name: clippy по нашему файлу
        run: |
          cargo clippy --release 2>&1 | grep -B2 -A12 "media_controls_linux" || echo "clippy - замечаний к media_controls_linux.rs нет"
      - run: cargo test --release
      - run: strip target/release/streamtube
      - uses: actions/upload-artifact@v4
        with:
          name: pr-files
          path: |
            Cargo.lock
            src/media_controls_linux.rs
            src/main.rs
            target/release/streamtube
